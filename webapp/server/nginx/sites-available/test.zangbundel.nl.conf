# Deploy to /etc/nginx/sites-available/test.zangbundel.nl.conf and link it in sites-enabled.
# The test instance (webappTDS TD-13): testers only, basic auth (SR-80), noindex (SR-81, through
# $zbm_robots in conf.d/zangbundel.conf). securityAssessment 7.1.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test.zangbundel.nl;

    ssl_certificate     /etc/letsencrypt/live/test.zangbundel.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.zangbundel.nl/privkey.pem;

    root /srv/zangbundel-test/live;
    access_log /var/log/nginx/zangbundel/test.access.log zbm_anon;
    error_log  /var/log/nginx/zangbundel/test.error.log error;

    auth_basic           "Zangbundel test";
    auth_basic_user_file /etc/nginx/zangbundel-test.htpasswd;     # htpasswd -B (bcrypt)

    include snippets/zbm-site.conf;

    location = /robots.txt {
        auth_basic off;
        include snippets/zbm-file-headers.conf;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
