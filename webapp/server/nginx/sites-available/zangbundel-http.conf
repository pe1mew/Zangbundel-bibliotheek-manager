# Deploy to /etc/nginx/sites-available/zangbundel-http.conf and link it in sites-enabled.
# Port 80 for both hosts: ACME challenges for certbot --webroot, everything else to HTTPS.
# This is also the bootstrap: enable it alone first, get the certificates, then enable the two
# 443 vhosts (server/README.md, step 5). certbot never edits these files (certonly --webroot).
server {
    listen 80;
    listen [::]:80;
    server_name zangbundel.nl test.zangbundel.nl;
    server_tokens off;
    access_log /var/log/nginx/zangbundel.access.log zbm_anon;
    error_log  /var/log/nginx/zangbundel.error.log error;
    log_not_found off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    # $host, not $server_name (that is always the first name). Only the two exact names above
    # reach this server, so $host is one of them.
    location / {
        return 301 https://$host$request_uri;
    }
}
