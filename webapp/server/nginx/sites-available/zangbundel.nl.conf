# Deploy to /etc/nginx/sites-available/zangbundel.nl.conf and link it in sites-enabled.
# The manager (v0.2.0 on; before it the placeholder, webappTDS TD-20). securityAssessment 7.1.
# No "http2" on the listen line: on nginx 1.24 that parameter applies to the whole 443 socket,
# so it is not ours to set. On contabo6 another vhost (console.rfsee.net) already sets it, so this
# site speaks HTTP/2 there as well; the headers are the same either way (checked over h2 in
# webapp/server/test/run.sh).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zangbundel.nl;

    ssl_certificate     /etc/letsencrypt/live/zangbundel.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zangbundel.nl/privkey.pem;

    root /srv/zangbundel/live;                                    # symlink to a verified release, SR-11
    access_log /var/log/nginx/zangbundel/access.log zbm_anon;     # 14 days: server/logrotate/zangbundel, SR-51
    error_log  /var/log/nginx/zangbundel/error.log error;

    include snippets/zbm-site.conf;
    # No front door: the placeholder's redirect from / to /nl/, /en/ or /de/ went with it; / is the manager's page.
}
