# SPDX-License-Identifier: Apache-2.0
# Deploy to /etc/nginx/snippets/zbm-file-headers.conf. Every response that is not an HTML page.
# An SVG opened on its own is a document that could run script; this CSP and the sandbox stop it.
# Also the set of the server block, so nginx's own HTML error pages carry a CSP (SR-20).
include snippets/zbm-common-headers.conf;
add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; sandbox" always;
