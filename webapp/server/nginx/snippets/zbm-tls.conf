# SPDX-License-Identifier: Apache-2.0
# Deploy to /etc/nginx/snippets/zbm-tls.conf. SR-01: TLS 1.2 and 1.3, Mozilla "intermediate" suites.
# The protocol versions are fixed by the DEFAULT server of the 443 socket before SNI selects
# this server; the cipher list here does apply. On contabo6 the default server (sites-available/
# default: snakeoil certificate, return 444) sets no protocols, so nginx.conf's list applies;
# Ubuntu's OpenSSL 3 security level refuses TLS 1.0 and 1.1 even where that list names them
# (measured in the M0 container test). SC-02 (testssl.sh) checks what is actually offered.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:zbm_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
