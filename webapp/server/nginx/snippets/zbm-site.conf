# SPDX-License-Identifier: Apache-2.0
# Deploy to /etc/nginx/snippets/zbm-site.conf. Included in the 443 server block of both hosts.
# securityAssessment 7.1: SR-25, SR-51, SR-60, SR-61.
include snippets/zbm-tls.conf;

server_tokens off;
autoindex off;
absolute_redirect off;
charset utf-8;
charset_types text/plain text/css image/svg+xml application/json;   # text/html is always included

client_max_body_size 1k;
client_body_timeout 5s;
client_header_timeout 5s;
keepalive_timeout 15s;
send_timeout 10s;
limit_req zone=zbm_req burst=40 nodelay;
limit_req_status 429;
limit_conn zbm_conn 20;
limit_conn_status 429;
# The error log holds full client addresses (nginx cannot shorten them there). Keep it to real
# faults: no "file not found", and rate-limit events below the error level (SR-51, 7.5).
limit_req_log_level warn;
limit_conn_log_level warn;
log_not_found off;

# Responses made here or in a location without headers of its own (the 405 below, the 404s of
# the dot-file and backup rules) carry the server-level set: common headers plus a CSP.
include snippets/zbm-file-headers.conf;

if ($request_method !~ ^(GET|HEAD)$) { return 405; }             # SR-25

location ~ (^|/)\.(?!well-known/) { return 404; }                 # dot files
location ~ (~|\.bak|\.orig|\.swp|\.tmp)$ { return 404; }           # editor and backup files
location = /release-manifest.json     { return 404; }              # read by the integrity check, not by visitors
location = /release-manifest.json.sig { return 404; }

location ~ \.html$ {
    include snippets/zbm-html-headers.conf;
}
location /assets/ {                                                # hashed names only, SR-61
    include snippets/zbm-file-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
location = /.well-known/security.txt {
    auth_basic off;                                                # reachable on the test instance too
    include snippets/zbm-file-headers.conf;
    add_header Cache-Control "no-cache" always;
}
location / {
    index index.html;
    include snippets/zbm-file-headers.conf;
    add_header Cache-Control "no-cache" always;
}
