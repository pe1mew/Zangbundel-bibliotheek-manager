# Deploy to /etc/nginx/snippets/zbm-common-headers.conf.
# Headers on every response, errors included ('always'). SR-02, SR-21, SR-22, SR-81.
# TRAP: a location with any add_header of its own drops every add_header of the server block,
# so the server block AND every location that adds a header include this file. SC-01 checks it.
add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;   # HSTS ramp: server/README.md step 9
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# SR-23 asks these of HTML responses; nginx's own error pages (401, 403, 404, 405, 429) are HTML
# too, so every response carries them. Harmless on images and stylesheets.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
add_header X-Robots-Tag $zbm_robots always;
