# Deploy to /etc/nginx/snippets/zbm-html-headers.conf. HTML documents (SR-20, SR-23, SR-24, SR-61).
include snippets/zbm-common-headers.conf;
add_header Cache-Control "no-cache" always;
add_header Content-Security-Policy $zbm_csp_html always;
add_header Integrity-Policy "blocked-destinations=(script)" always;
