# Deploy to /etc/nginx/conf.d/zangbundel.conf (http context; nginx.conf includes conf.d/*.conf).
# Shared by zangbundel.nl and test.zangbundel.nl. securityAssessment 7.1.

# SR-51: shorten the client address before it is logged. IPv4 to /24, IPv6 to /48.
map $remote_addr $zbm_ip_anon {
    # Regexes with braces must be quoted in nginx.
    ~^(?<p>\d+\.\d+\.\d+)\.\d+$                           $p.0;
    "~*^(?<p>[0-9a-f]{0,4}:[0-9a-f]{0,4}:[0-9a-f]{0,4}):" $p::;
    default                                               0.0.0.0;
}

# No user agent, no referrer, no user name (SR-51).
log_format zbm_anon '$zbm_ip_anon [$time_local] "$request" $status $body_bytes_sent';

# SR-60: rate and connection limits per client address.
limit_req_zone  $binary_remote_addr zone=zbm_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=zbm_conn:10m;

# Language of the placeholder's front door: the first language the browser asks for,
# if it is one of ours; otherwise English (webappTDS TD-20).
map $http_accept_language $zbm_lang {
    ~*^\s*nl   nl;
    ~*^\s*de   de;
    ~*^\s*en   en;
    default    en;
}

# Per-site header values, keyed on the matched server's own name, not the client's Host.
# An empty value makes nginx leave the header out.
map $server_name $zbm_csp_html {
    # Static pages without script: the placeholder and the test holding page (SR-20, placeholder form).
    zangbundel.nl       "default-src 'none'; script-src 'none'; worker-src 'none'; style-src 'self'; img-src 'self'; manifest-src 'none'; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests";
    test.zangbundel.nl  "default-src 'none'; script-src 'none'; worker-src 'none'; style-src 'self'; img-src 'self'; manifest-src 'none'; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests";
    # When the manager is deployed on a host, that host's line becomes the CSP of SR-20:
    # "default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self' data: blob:; manifest-src 'self'; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types zbm-download"
    default             "default-src 'none'";
}

map $server_name $zbm_robots {
    test.zangbundel.nl  "noindex, nofollow";   # SR-81
    default             "";
}
