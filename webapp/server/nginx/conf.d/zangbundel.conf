# Deploy to /etc/nginx/conf.d/zangbundel.conf (http context; nginx.conf includes conf.d/*.conf).
# Shared by zangbundel.nl and test.zangbundel.nl. securityAssessment 7.1.

# SR-51: shorten the client address before it is logged. IPv4 to /24, IPv6 to /48.
# IPv6 arrives in compressed form: keep the groups before a '::' only while they are among the
# first three, so no bit beyond the /48 survives (2001:db8::1 -> 2001:db8::, 2001::5:6:7 -> 2001::).
# Regexes are tried in order; regexes with braces must be quoted in nginx.
map $remote_addr $zbm_ip_anon {
    ~^(?<p>\d+\.\d+\.\d+)\.\d+$                                    $p.0;
    "~*^(?<p>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):"          $p::;
    "~*^(?<p>[0-9a-f]{1,4}(?::[0-9a-f]{1,4})?)::"                  $p::;
    "~^::"                                                         ::;
    default                                                        0.0.0.0;
}

# No user agent, no referrer, no user name (SR-51).
log_format zbm_anon '$zbm_ip_anon [$time_local] "$request" $status $body_bytes_sent';

# SR-60: rate and connection limits per client address.
limit_req_zone  $binary_remote_addr zone=zbm_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=zbm_conn:10m;

# Per-site header values, keyed on the matched server's own name, not the client's Host.
# An empty value makes nginx leave the header out.
map $server_name $zbm_csp_html {
    # The manager runs on both hosts (v0.2.0 on zangbundel.nl, replacing the placeholder): both get the CSP of SR-20.
    zangbundel.nl       "default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self' data: blob:; manifest-src 'self'; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types zbm-worker";
    test.zangbundel.nl  "default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self' data: blob:; manifest-src 'self'; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types zbm-worker";
    default             "default-src 'none'";
}

map $server_name $zbm_robots {
    test.zangbundel.nl  "noindex, nofollow";   # SR-81
    default             "";
}
