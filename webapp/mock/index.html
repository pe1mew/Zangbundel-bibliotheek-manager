<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- MOCK of design/webappGUI.md draft 0.6 (GD-03 to GD-15). Not the web app: no file is read or written. -->
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zangbundel bibliotheek-manager (mock)</title>
  <link rel="icon" href="img/zangbundel-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="mock.css">
</head>
<body>
  <div class="mockbar">
    <strong>MOCK</strong>
    <span>webappGUI draft 0.6 · jump to:</span>
    <button data-jump="splash">1 Opstarten</button>
    <button data-jump="home">2 Hoofdpagina</button>
    <button data-jump="view">3 Bibliotheek, lied bekijken</button>
    <button data-jump="edit">4 Lied bewerken</button>
    <button data-jump="check">5 Controle bij toepassen</button>
    <label><input type="checkbox" id="badges" checked> show open questions (GQ)</label>
  </div>

  <div class="app">
    <aside class="left" id="left" aria-label="Liedgegevens"></aside>
    <main class="centre" id="centre"></main>
    <aside class="right" id="right" aria-label="Liedjes"></aside>
    <nav class="bottom" id="bottom" aria-label="Navigatie"></nav>
    <!-- GD-10: inner edges of the side bars, with a fold tab in the middle -->
    <div class="edge edge-left" id="edge-left" role="separator" aria-orientation="vertical" aria-controls="left" aria-label="Breedte liedgegevens" tabindex="0">
      <button class="foldtab" id="tab-left" aria-controls="left" aria-expanded="true" title="Liedgegevens inklappen"></button>
    </div>
    <div class="edge edge-right" id="edge-right" role="separator" aria-orientation="vertical" aria-controls="right" aria-label="Breedte liedjeslijst" tabindex="0">
      <button class="foldtab" id="tab-right" aria-controls="right" aria-expanded="true" title="Liedjeslijst inklappen"></button>
    </div>
  </div>

  <script src="mock.js"></script>
</body>
</html>
