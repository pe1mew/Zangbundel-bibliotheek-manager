<!doctype html>

<!-- MOCK of design/webappGUI.md draft 0.12 (GD-03 to GD-40). Not the web app: no library or key is read, written or sent. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zangbundel library manager (mock)</title>
  <link rel="icon" href="img/zangbundel-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="mock.css">
</head>
<body>
  <div class="mockbar">
    <strong>MOCK</strong>
    <span>v0.1.0+ · webappGUI draft 0.12 · jump to:</span>
    <button data-jump="splash">1 Splash</button>
    <button data-jump="home">2 Home</button>
    <button data-jump="view">3 Song</button>
    <button data-jump="library">4 Library fields</button>
    <button data-jump="edit">5 Edit</button>
    <button data-jump="text">6 Code (ChordPro)</button>
    <button data-jump="check">7 Check</button>
    <button data-jump="sets">8 Set</button>
    <button data-jump="signed">9 Signed library</button>
    <label><input type="checkbox" id="badges" checked> show design IDs</label>
  </div>

  <div class="app">
    <aside class="left" id="left"></aside>
    <main class="centre" id="centre"></main>
    <aside class="right" id="right"></aside>
    <nav class="bottom" id="bottom"></nav>
    <!-- GD-10: inner edges of the side bars, with a fold tab in the middle -->
    <div class="edge edge-left" id="edge-left" role="separator" aria-orientation="vertical" aria-controls="left" tabindex="0">
      <button class="foldtab" id="tab-left" aria-controls="left" aria-expanded="true"></button>
    </div>
    <div class="edge edge-right" id="edge-right" role="separator" aria-orientation="vertical" aria-controls="right" tabindex="0">
      <button class="foldtab" id="tab-right" aria-controls="right" aria-expanded="true"></button>
    </div>
  </div>

  <!-- GD-32: shown instead of the app in a window narrower than 980 px -->
  <div id="narrow" class="narrow"></div>

  <script src="i18n.js"></script>
  <script src="mock.js"></script>
</body>
</html>
